name: Profile refresh audit (temporary)
on:
  push:
    branches: [fix/profile-k2quant-vocora-gruccia]
    paths: [.github/workflows/profile-refresh-audit.yml]
permissions:
  contents: write
jobs:
  validate-and-commit:
    if: github.repository == 'OkBayat/OkBayat.github.io' && github.ref == 'refs/heads/fix/profile-k2quant-vocora-gruccia'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed edits and verify regression checks fail first
        shell: bash
        run: |
          mkdir -p /tmp/profile-validation
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          packet = json.loads(zlib.decompress(base64.b64decode(''.replace('AhbNatH988', 'AhbNB988'))))
          root = pathlib.Path('.')
          validator = root / 'scripts/validate_content_architecture.js'
          anchor = 'const footer = fs.readFileSync(\n'
          source = validator.read_text()
          assert source.count(anchor) == 1
          validator.write_text(source.replace(anchor, packet['checks'] + anchor))
          result = subprocess.run(['node', str(validator)], capture_output=True, text=True)
          pathlib.Path('/tmp/profile-validation/regression-red.txt').write_text(result.stdout + result.stderr)
          print(result.stdout + result.stderr)
          assert result.returncode == 1, 'New checks must detect the existing errors'
          for edit in packet['edits']:
              path = root / edit['path']
              assert edit['path'] in packet['expected']
              text = path.read_text()
              assert text.count(edit['old']) == edit['count'], edit['path']
              path.write_text(text.replace(edit['old'], edit['new']))
          for name, expected in packet['expected'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          pathlib.Path('/tmp/profile-validation/expected-hashes.json').write_text(json.dumps(packet['expected'], indent=2))
          PY
      - name: Regenerate and inspect downloadable CV
        shell: bash
        run: |
          python3 -m pip install 'reportlab==4.4.9' 'PyMuPDF==1.26.7'
          python3 scripts/generate_cv_pdf.py
          python3 - <<'PY'
          import fitz, importlib.util, pathlib, re
          spec = importlib.util.spec_from_file_location('generator', 'scripts/generate_cv_pdf.py')
          generator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(generator)
          document = fitz.open('assets/downloads/mohammad-bayat-cv.pdf')
          text = ' '.join(' '.join(page.get_text().split()) for page in document)
          assert len(document) == 3
          for phrase in ['K2Quant - Founder and Software Engineer', 'Vocora - Founder and Software Engineer July 2026 - Present', 'Gruccia - Leadership Facilitator July 2024 - Present', 'Associate Coaching Certification', 'Self-study and Private Classes']:
              assert phrase in text, phrase
          assert not re.search(r'K2[\s_-]*Group', text, re.I)
          source = pathlib.Path('docs/about/cv.md').read_text()
          for kind, value in generator.content_blocks(generator.source_body(source)):
              plain = generator.Paragraph(generator.inline_markup(value), generator.getSampleStyleSheet()['BodyText']).getPlainText()
              assert ' '.join(plain.split()) in text, (kind, plain)
          pathlib.Path('/tmp/profile-validation/pdf-content.txt').write_text(text)
          for number, page in enumerate(document, 1):
              page.get_pixmap(matrix=fitz.Matrix(1.3, 1.3)).save(f'/tmp/profile-validation/cv-page-{number}.png')
          print('PDF validation passed: three pages, all source content and profile corrections present.')
          PY
          cp assets/downloads/mohammad-bayat-cv.pdf /tmp/profile-validation/
      - name: Validate content and build the site
        shell: bash
        run: |
          set -o pipefail
          {
            npm ci
            npm test
            ruby scripts/validate_publications.rb
            bundle exec ruby scripts/validate_custom_markdown_processor.rb
            ruby scripts/validate_list_and_sidebar_styles.rb
            bundle exec jekyll build
            node scripts/validate_site_integrity.js _site
            ruby scripts/validate_profile_photos.rb _site
            ruby scripts/validate_navigation_priorities.rb _site
            ruby scripts/validate_child_page_navigation.rb _site
            ruby scripts/validate_publication_navigation.rb _site
            ruby scripts/validate_timeline.rb _site
            ruby scripts/validate_article_language_switch.rb _site
          } 2>&1 | tee /tmp/profile-validation/validation.txt
      - name: Review final scope and commit only the requested changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          expected = set(json.loads(pathlib.Path('/tmp/profile-validation/expected-hashes.json').read_text()))
          expected.add('assets/downloads/mohammad-bayat-cv.pdf')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, (changed, expected)
          for path in pathlib.Path('_site').rglob('*.html'):
              assert not re.search(r'K2[\s_-]*Group', path.read_text(), re.I), path
          subprocess.run(['git', 'add', '--', *sorted(expected)], check=True)
          PY
          git diff --cached --check
          git diff --cached --stat | tee /tmp/profile-validation/change-summary.txt
          git diff --cached -- . ':!*.pdf' > /tmp/profile-validation/review.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: synchronize K2Quant, Vocora dates, and Gruccia profiles'
          git push origin HEAD:refs/heads/fix/profile-k2quant-vocora-gruccia
          git rev-parse HEAD > /tmp/profile-validation/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-validation
          path: /tmp/profile-validation/
          retention-days: 1
          if-no-files-found: warn
