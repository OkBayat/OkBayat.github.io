name: Refresh corrected coaching CV (one-off)

on:
  push:
    branches: [fix/coaching-credentials]
    paths: [.github/workflows/refresh-coaching-cv-once.yml]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'OkBayat/OkBayat.github.io' && github.ref == 'refs/heads/fix/coaching-credentials'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coaching-credentials
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing CV generator dependencies
        run: |
          python -m pip install reportlab==4.4.9
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
      - name: Add focused credential regression checks
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          path = Path('scripts/validate_content_architecture.js')
          content = path.read_text(encoding='utf-8')
          raw = path.read_bytes()
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == 'a764059882f8d1fc75df07b8246a48e13edbca1e'
          needle = '  const pdfPath = path.join(ROOT, "assets/downloads/mohammad-bayat-cv.pdf")'
          assert content.count(needle) == 1
          addition = '''  const coachingEntries = [
              [
                "Master-Level Coaching Training",
                "Self-study and Private Classes · 2021 - 2023",
              ],
              [
                "Professional Coaching Certification",
                "Farsi Coaching Academy · 2019 - 2021",
              ],
              [
                "Associate Coaching Certification",
                "Farsi Coaching Academy · 2018 - 2019",
              ],
              ["Business Coaching Certification", "IBC Academy · 2019"],
            ]
            for (const [title, details] of coachingEntries) {
              if (!cv.body.includes(`### ${title}\\n\\n**${details}**`)) {
                errors.add(`docs/about/cv.md: missing or incorrect coaching entry ${title}`)
              }
            }
            if (/Master Coaching Certification/i.test(cv.body)) {
              errors.add(
                "docs/about/cv.md: self-study and private classes must not be presented as Master Coaching Certification"
              )
            }
          
          '''
          path.write_text(content.replace(needle, addition + needle), encoding='utf-8')
      - name: Generate PDF and validate corrected source
        run: |
          python scripts/generate_cv_pdf.py
          node --check scripts/validate_content_architecture.js
          node scripts/validate_content_architecture.js
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-coaching-cv-review
          path: assets/downloads/mohammad-bayat-cv.pdf
          retention-days: 1
      - name: Verify source, regression guard, and deterministic runner PDF
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
              'docs/about/cv.md': 'ecc3a5f93dc1d3f0f68ead03c3efa49c22c18fb0',
              'scripts/validate_content_architecture.js': 'b3e6c44f4e489e420397c0351cccf81d1291b4c7',
              'assets/downloads/mohammad-bayat-cv.pdf': 'e70809cd11ead58cd5dfbf3761a7cd1cd2986c37',
          }
          for filename, wanted in expected.items():
              data = Path(filename).read_bytes()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              print(filename, actual)
              assert actual == wanted, f'{filename} differs from the expected file'
      - name: Commit only corrected PDF and regression guard to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/downloads/mohammad-bayat-cv.pdf scripts/validate_content_architecture.js
          git commit -m "fix(cv): regenerate corrected PDF and guard coaching entries"
          git push origin HEAD:fix/coaching-credentials
