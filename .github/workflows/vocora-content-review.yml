name: Vocora branch content review

on:
  push:
    branches: [content/vocora-ielts-startup]
    paths: [.github/workflows/vocora-content-review.yml]

permissions:
  contents: write

concurrency:
  group: vocora-content-review
  cancel-in-progress: false

jobs:
  content-review:
    if: github.repository == 'OkBayat/OkBayat.github.io' && github.ref == 'refs/heads/content/vocora-ielts-startup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: content/vocora-ielts-startup
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/vocora-ielts-startup
      - name: Confirm branch and configure isolated commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check reportlab==4.4.9
      - name: Update supporting references and remove gamification
        shell: bash
        run: |
          set -euo pipefail
          python .github/vocora-content-update.py supporting
          node scripts/validate_content_architecture.js
          node scripts/validate_site_integrity.js
          ruby scripts/validate_publications.rb
          git diff --check
          git add _data/publications.yml _data/publications_fa.yml docs/research docs/writing/all-writing-en.md docs/writing/all-writing-fa.md docs/projects/project-records.md docs/projects/vocora/publications.md docs/leadership-learning/human-transformation/index.md
          git commit -m 'docs(vocora): remove gamification and align supporting references'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Align editorial guide and site descriptions
        shell: bash
        run: |
          set -euo pipefail
          python .github/vocora-content-update.py editorial
          node scripts/validate_content_architecture.js
          node scripts/validate_site_integrity.js
          git diff --check
          git add README.md _config.yml _includes/footer_custom.html
          git commit -m 'docs(brand): align editorial guide, metadata and footer'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Update professional profiles and regenerate the reviewed CV
        shell: bash
        run: |
          set -euo pipefail
          python .github/vocora-content-update.py guards
          if node scripts/validate_content_architecture.js > /tmp/vocora-regression-red.log 2>&1; then
            echo 'Expected the new profile checks to reject the old founding-role placement'
            exit 1
          fi
          cat /tmp/vocora-regression-red.log
          python .github/vocora-content-update.py profiles
          npx prettier --write scripts/validate_content_architecture.js
          python scripts/generate_cv_pdf.py
          echo 'ce586b74309bf365a48963a288974071acdaaa02843491e7491a27051105b75d  assets/downloads/mohammad-bayat-cv.pdf' | sha256sum --check
          npm test
          ruby scripts/validate_publications.rb
          ruby scripts/validate_list_and_sidebar_styles.rb
          bundle exec ruby scripts/validate_custom_markdown_processor.rb
      - name: Build and validate the complete site
        shell: bash
        run: |
          set -euo pipefail
          bundle exec jekyll build
          node scripts/validate_site_integrity.js _site
          ruby scripts/validate_profile_photos.rb _site
          ruby scripts/validate_navigation_priorities.rb _site
          ruby scripts/validate_child_page_navigation.rb _site
          ruby scripts/validate_publication_navigation.rb _site
          ruby scripts/validate_timeline.rb _site
          ruby scripts/validate_article_language_switch.rb _site
          git diff --check
      - name: Commit and push the verified profiles, CV and regression checks
        shell: bash
        run: |
          set -euo pipefail
          git add docs/about/cv.md docs/about/resume.md scripts/generate_cv_pdf.py assets/downloads/mohammad-bayat-cv.pdf scripts/validate_content_architecture.js
          git commit -m 'docs(profile): add Vocora founding experience and refresh the CV PDF'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Remove temporary review helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/vocora-content-update.py .github/workflows/vocora-content-review.yml
          git commit -m 'chore(review): remove temporary branch-only review helpers'
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Export review output
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/vocora-output
          cp assets/downloads/mohammad-bayat-cv.pdf /tmp/vocora-output/
          cp /tmp/vocora-regression-red.log /tmp/vocora-output/ 2>/dev/null || true
          git archive --format=tar.gz --output=/tmp/vocora-output/source.tar.gz HEAD -- . ':!assets/*.MP3'
          if test -d _site; then
            tar --exclude='*.MP3' -czf /tmp/vocora-output/site.tar.gz -C _site .
          fi
          git log -6 --oneline > /tmp/vocora-output/commits.txt
          git status --short > /tmp/vocora-output/worktree-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vocora-reviewed-output
          path: /tmp/vocora-output/
          retention-days: 1
